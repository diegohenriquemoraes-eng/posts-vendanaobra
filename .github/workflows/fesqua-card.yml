name: Card da Fesqua (contagem regressiva)

# ============================================================================
# Post UNICO, de feed, para 06/09/2026 — o card "Faltam 3 dias" com o Diego,
# em colaboracao com a @fesqua (fesqua_card.json).
#
# Por que 12h BRT: 06/09 e' DOMINGO, a grade Rota 100K dos dias 5-7 e'
# 09/15/18/21 e o Reel do EP25 ja ocupa as 15h. 12h e' o maior buraco do dia.
#
# Tres disparos e --garantir porque o cron do Actions e' "best effort": em
# 27/08/2026 o repo perdeu OS DOIS crons do dia e o Reel simplesmente nao saiu.
# Aqui nao ha segunda chance — no dia seguinte o numero do card ja esta errado.
# Minutos quebrados de proposito: minuto 0 e' o horario de maior fila.
#
# Depois que este card sair, o workflow pode ser apagado (ou o proximo card
# entra em fesqua_card.json e o schedule muda de data).
# ============================================================================

on:
  schedule:
    - cron: "56 14 6 9 *"   # 11h56 BRT de 06/09
    - cron: "11 16 6 9 *"   # repescagem 13h11 BRT
    - cron: "39 17 6 9 *"   # 2a repescagem 14h39 BRT
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Ensaio: mostra o que sairia, sem publicar"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar card
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          VNO_FESQUA_ATIVO: "1"
        run: |
          args=""
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            args="$args --garantir"
          fi
          python publicar_card_fesqua.py $args

      - name: Avisar se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Card da Fesqua nao publicou",
              body: "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId + "\n\n" +
                    "O card e' de contagem regressiva: se nao sair hoje, o numero " +
                    "fica errado. Publicar na mao pelo app, marcando a @fesqua " +
                    "como colaboradora."
            })
