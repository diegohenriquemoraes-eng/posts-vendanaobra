name: Mini-aula @vendanaobra

# ============================================================================
# MINI-AULA PAUSADA EM 04/09/2026 (decisao do Diego) — "interrompe, mas mantem
# o estudo ate eu pedir para voltar".
#
# Nao sai mais mini-aula por API: nem a de terca nem a de quinta. A ultima foi
# a aula 6, em 03/09. A pausa vale ja para a semana de 08/09 — as aulas 18 e 16
# continuam na fila, sem data, e a sequencia NAO foi mexida: quando o Diego
# mandar voltar, a proxima peca e exatamente a que sairia agora.
#
# O ESTUDO CONTINUA INTEIRO, de proposito: `miniaulas.json` (33 aulas),
# `PAUTA-MINIAULAS.md`, `fotos/`, `gerar_miniaula.py`, `publicar_miniaula.py` e
# `cenas_miniaulas.json` ficam como estao. Nada de banco foi apagado.
#
# TRAVA DUPLA, como manda o repo (uma pausa so no cron ja falhou uma vez —
# ver post-diario.yml e a licao de 17/08): o bloco `schedule` esta comentado E
# `publicar_miniaula.py` recusa publicar sem `VNO_MINIAULA_ATIVA=1`, que este
# workflow NAO define. `workflow_dispatch` continua servindo para `--ensaio`
# (gerar a peca e ler a legenda sem publicar).
#
# PARA VOLTAR (so com pedido explicito do Diego): descomentar o `schedule`,
# devolver `VNO_MINIAULA_ATIVA: "1"` ao step de publicar e, se o workflow
# estiver desabilitado na UI, `gh workflow enable miniaula.yml`.
#
# O robo de DM (`dm-comentarios.yml`) FICA LIGADO: os comentarios da mini-aula
# de 01/09 ainda estao dentro da janela de 7 dias da Meta e precisam de resposta.
# ============================================================================
#
# Historico ate aqui: publicacao por API encerrada em 21/08/2026, religada so
# para o carrossel longo em 24/08/2026 (terca e quinta, 12h BRT, com story de
# reforco), pausada de novo em 04/09/2026.

on:
  # DESLIGADO 04/09/2026 — o bloco `schedule` inteiro esta comentado.
  # schedule:
  #   - cron: "45 14 * * 2,4"   # ter e qui, 12h BRT
  #   # repescagens: publicam so se a mini-aula do dia nao saiu (--garantir)
  #   - cron: "0 16 * * 2,4"    # 13h BRT
  #   - cron: "0 20 * * 2,4"    # 17h BRT
  workflow_dispatch:
    inputs:
      id:
        description: "Forcar uma aula especifica (id do miniaulas.json)"
        required: false
        type: string
      ensaio:
        description: "Ensaio: gera tudo sem publicar"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      # Inerte enquanto o schedule estiver comentado; fica aqui para o dia em
      # que a mini-aula voltar, sem ter de reescrever a espera do meio-dia.
      - name: Esperar o meio-dia em ponto
        if: github.event_name == 'schedule' && github.event.schedule == '45 14 * * 2,4'
        run: |
          alvo=$(date -u -d "$(date -u +%F) 15:00:00" +%s)
          agora=$(date -u +%s)
          espera=$(( alvo - agora ))
          if [ "$espera" -gt 0 ]; then
            echo "esperando ${espera}s ate 15:00:00 UTC (12:00 BRT)"
            sleep "$espera"
          else
            echo "runner comecou atrasado (${espera}s); publicando agora"
          fi

      - name: Publicar mini-aula
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          args=""
          [ -n "${{ inputs.id }}" ] && args="$args --id ${{ inputs.id }}"
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          # repescagens das 13h/17h entram com --garantir
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "45 14 * * 2,4" ]; then
            args="$args --garantir"
          fi
          python publicar_miniaula.py $args

      # A hora seguinte a publicacao e quando chega quase todo comentario, e e
      # justamente quando nao da para depender do cron de 10 minutos (o Actions
      # despriorizada schedule de alta frequencia; ver dm-comentarios.yml). Aqui
      # o atendimento anda dentro do proprio job que publicou: 12 passadas de 5
      # em 5 minutos. Nao duplica nada — quem ja foi atendido esta no
      # respondidos_dm.json, e a Meta so aceita uma resposta por comentario.
      - name: Atender os comentarios da primeira hora
        if: success() && !inputs.ensaio
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          for i in $(seq 1 12); do
            python responder_dm.py || echo "passada $i falhou; segue"
            [ "$i" -lt 12 ] && sleep 300
          done

      - name: Avisar se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const hoje = new Date().toISOString().slice(0, 10)
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Mini-aula falhou em " + hoje,
              body: "O workflow da mini-aula falhou. Run: " + context.serverUrl +
                    "/" + context.repo.owner + "/" + context.repo.repo +
                    "/actions/runs/" + context.runId + "\n\n" +
                    "Causas comuns: aula sem foto no fotos/, token da Meta, banco esgotado."
            })
