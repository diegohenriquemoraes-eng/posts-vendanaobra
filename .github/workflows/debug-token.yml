name: Debug token Meta

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostico do token
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          echo "== /me =="
          curl -s "https://graph.facebook.com/v21.0/me?access_token=${META_TOKEN}" | head -c 800
          echo
          echo "== debug_token =="
          curl -s "https://graph.facebook.com/v21.0/debug_token?input_token=${META_TOKEN}&access_token=${META_TOKEN}" | head -c 1200
          echo
          echo "== /me/accounts (paginas) =="
          curl -s "https://graph.facebook.com/v21.0/me/accounts?fields=id,name,instagram_business_account&access_token=${META_TOKEN}" | head -c 1200
          echo
          echo "== IG user direto =="
          curl -s "https://graph.facebook.com/v21.0/17841470188725651?fields=id,username&access_token=${META_TOKEN}" | head -c 600
          echo
