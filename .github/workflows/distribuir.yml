name: Distribuir Reel no YouTube

# ============================================================================
# O Reel do @vendanaobra vira Short no canal @vendanaobra do YouTube.
#
# POR QUE (medido em 05/09/2026): o canal tem 78 videos, 74 inscritos e 27.111
# views e esta PARADO desde 02/05/2026. Os Shorts de la fazem 560 a 956 views;
# a mediana de alcance de um post no Instagram e 73. Mesmo conteudo, ~10x mais
# gente — e o YouTube e buscador, entao o video segue sendo achado depois.
#
# RITMO: ate 5 por dia (TETO_DIA no distribuir.py), em cinco janelas. Quem manda
# o teto e a COTA: videos.insert custa 1.600 e o projeto vendanaobra-automacao
# tem 10.000/dia, entao 5 uploads = 8.000 e sobra margem para um reenvio; 6 =
# 9.600 e um retry derruba o dia. Era 2/dia ate 05/09/2026 — pouco demais se o
# Diego postar 4 ou 5 Reels no Instagram, porque a fila nunca escoaria.
#
# HORARIOS QUEBRADOS de proposito: o cron do GitHub e "best effort" e o minuto
# 0 e o de maior fila — em 27/08/2026 o reel-diario.yml perdeu os dois disparos
# do dia por causa disso.
# ============================================================================

on:
  schedule:
    # Cinco janelas, uma por hora do dia em que o Diego costuma postar. Cada uma
    # publica ate 2, e o teto DIARIO de 5 mora no distribuir.py (TETO_DIA), que
    # conta o que ja saiu hoje — cron do GitHub atrasa e coalesce, entao o teto
    # nao pode depender do numero de disparos.
    - cron: "17 13 * * *"   # 10h17 BRT
    - cron: "23 16 * * *"   # 13h23 BRT
    - cron: "41 18 * * *"   # 15h41 BRT
    - cron: "37 21 * * *"   # 18h37 BRT
    - cron: "13 0 * * *"    # 21h13 BRT
  workflow_dispatch:
    inputs:
      limite:
        description: "Quantos videos nesta execucao (o teto diario continua valendo)"
        required: false
        default: "2"
      ensaio:
        description: "Ensaio: mostra o que subiria, sem publicar"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: distribuir-youtube
  cancel-in-progress: false

jobs:
  distribuir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet google-api-python-client google-auth

      - name: Distribuir
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          YT_TOKEN: ${{ secrets.YT_TOKEN_VNO }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          args="--limite ${{ inputs.limite || 2 }}"
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          python distribuir.py $args

      - name: Commitar o estado
        if: inputs.ensaio != true
        run: |
          # Sem este commit o runner descartavel perde a memoria do que ja subiu
          # e a proxima execucao republica o mesmo video.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add distribuidos.json
          git diff --staged --quiet || git commit -m "Distribui no YouTube (auto)"
          git pull --rebase --autostash || true
          git push

      - name: Avisar se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const hoje = new Date().toISOString().slice(0, 10)
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Distribuicao no YouTube falhou em " + hoje,
              body: "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId + "\n\n" +
                    "Causas comuns: token do YouTube revogado (YT_TOKEN_VNO), " +
                    "token da Meta, ou cota de 10.000 unidades/dia estourada no " +
                    "projeto vendanaobra-automacao."
            })
