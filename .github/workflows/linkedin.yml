name: LinkedIn diario

# ============================================================================
# Um artigo do blog por DIA UTIL no perfil do Diego.
#
# POR QUE: no Instagram e no TikTok quem le e o VENDEDOR; no LinkedIn e o dono
# da vidracaria, o gerente da construtora, o industrial do aluminio — quem
# compra consultoria e nao e-book de R$ 47. E o unico canal do plano capaz de
# gerar contrato. Por isso o texto e escrito para decisor.
#
# Fim de semana nao publica (a trava esta no script): rede de trabalho, post de
# sabado morre.
#
# ⚠ O TOKEN VENCE EM 60 DIAS E NAO SE RENOVA. O LinkedIn so entrega
# refresh_token para app de parceiro aprovado; o nosso e autosservico. Quando
# faltarem 7 dias, o script avisa e este workflow abre issue — sem isso o canal
# morre em silencio, que foi como o YouTube ficou 4 meses parado.
# ============================================================================

on:
  schedule:
    # Segunda, quarta e sexta. Terca e quinta sao do carrossel
    # (linkedin-carrossel.yml): dois posts do mesmo perfil no mesmo dia
    # competem entre si na entrega.
    - cron: "47 11 * * 1,3,5"   # 08h47 BRT
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Ensaio: mostra o que sairia, sem publicar"
        required: false
        type: boolean
        default: false
      forcar:
        description: "Publicar mesmo no fim de semana"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-diario
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar
        id: pub
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
          LINKEDIN_TOKEN_ATE: ${{ secrets.LINKEDIN_TOKEN_ATE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          args=""
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          [ "${{ inputs.forcar }}" = "true" ] && args="$args --forcar"
          python linkedin_publicar.py $args | tee saida.txt
          if grep -q "vence em" saida.txt; then echo "vencendo=1" >> $GITHUB_OUTPUT; fi

      - name: Avisar que o token esta vencendo
        if: steps.pub.outputs.vencendo == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: "linkedin-token", state: "open",
            })
            if (abertas.data.length) return
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "Token do LinkedIn vence em menos de 7 dias",
              labels: ["linkedin-token"],
              body: "O token do LinkedIn dura 60 dias e **nao se renova sozinho** " +
                    "(o LinkedIn so da refresh_token para app de parceiro aprovado).\n\n" +
                    "Para renovar: o Diego abre a URL de autorizacao, faz login, e o " +
                    "code que cai na pagina de erro vira token novo. O passo a passo " +
                    "esta no RETOMAR-crescimento-vendanaobra.md.",
            })

      - name: Commitar o estado
        if: inputs.ensaio != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linkedin_publicados.json
          git diff --staged --quiet || git commit -m "Publica no LinkedIn (auto)"
          git pull --rebase --autostash || true
          git push

      - name: Avisar se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const hoje = new Date().toISOString().slice(0, 10)
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "LinkedIn diario falhou em " + hoje,
              body: "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId + "\n\n" +
                    "Causas comuns: LINKEDIN_TOKEN vencido (60 dias, sem renovacao " +
                    "automatica) ou a LinkedIn-Version do cabecalho expirada — ela " +
                    "morre com o tempo e o erro e 426 NONEXISTENT_VERSION.",
            })
