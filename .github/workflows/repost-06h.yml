name: Repost das 06h @vendanaobra
# Veio do editor-nuvem (privado) em 26/11/2026, pelo mesmo motivo do Reel de teste: repo publico nao gasta minutos.
# Faz o checkout do editor-nuvem com o GH_PAT, roda repost/postar.py de la e grava a fila la. O cron de la foi desligado.
# Publica o repost do dia no Reels do @vendanaobra (so na aba Reels), sem depender do notebook.
# 06:00 de Brasilia = 09:00 UTC. O cron do GitHub atrasa, entao ha repescagens: o script so publica
# o item de hoje que ainda nao saiu (estado em repost/fila.json, que este workflow commita).
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "20 9 * * *"
    - cron: "45 9 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar | ensaio | teste (sobe um video e NAO publica)"
        default: ensaio
      job:
        description: "so no modo teste: pasta do job (ex.: repost-07-mais-um-orcamento-2)"
        default: repost-07-mais-um-orcamento-2
concurrency:
  group: postar-repost
  cancel-in-progress: false
permissions:
  contents: read
env:
  META_TOKEN: ${{ secrets.IG_PUBLICAR_TOKEN }}
  G_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
  G_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
  G_REFRESH: ${{ secrets.DRIVE_REFRESH }}
jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { repository: diegohenriquemoraes-eng/editor-nuvem, token: "${{ secrets.GH_PAT }}", ref: main }
      - name: postar
        run: |
          MODO="${{ inputs.modo }}"
          if [ "$MODO" = "ensaio" ]; then python repost/postar.py --ensaio
          elif [ "$MODO" = "teste" ]; then python repost/postar.py --teste-upload "${{ inputs.job }}"
          else python repost/postar.py; fi
      - name: gravar estado
        if: always()
        run: |
          git config user.name "editor-nuvem"; git config user.email "editor-nuvem@users.noreply.github.com"
          git add repost/fila.json repost/log.txt
          git commit -qm "repost: estado da fila" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
