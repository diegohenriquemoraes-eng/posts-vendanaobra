name: Distribuir Reel no Pinterest

# ============================================================================
# O Reel do @vendanaobra vira Pin de video no Pinterest — via Zernio (2a vaga
# gratis). Decisao do Diego em 19/09/2026. O Pin ranqueia no Google e o link e
# clicavel (/r/pi-raiox). Ate 3 por dia, cinco janelas em minutos quebrados.
# Sem ZERNIO_API_KEY ou sem conta Pinterest no Zernio o script sai limpo.
# ============================================================================

on:
  schedule:
    - cron: "53 13 * * *"   # 10h53 BRT
    - cron: "11 17 * * *"   # 14h11 BRT
    - cron: "19 19 * * *"   # 16h19 BRT
    - cron: "47 21 * * *"   # 18h47 BRT
    - cron: "57 0 * * *"    # 21h57 BRT
  workflow_dispatch:
    inputs:
      limite:
        description: "Quantos videos nesta execucao (o teto diario continua valendo)"
        required: false
        default: "1"
      teto:
        description: "Teto diario so nesta execucao (carga de acervo)"
        required: false
        default: "3"
      pausa:
        description: "Segundos entre um Pin e outro"
        required: false
        default: "0"
      ensaio:
        description: "Ensaio: mostra o que subiria, sem publicar"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: distribuir-pinterest
  cancel-in-progress: false

jobs:
  distribuir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Distribuir
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_PINTEREST_ACCOUNT_ID: ${{ secrets.ZERNIO_PINTEREST_ACCOUNT_ID }}
          ZERNIO_PINTEREST_BOARD_ID: ${{ secrets.ZERNIO_PINTEREST_BOARD_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          args="--limite ${{ inputs.limite || 1 }} --teto ${{ inputs.teto || 3 }} --pausa ${{ inputs.pausa || 0 }}"
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          python distribuir_pinterest.py $args

      - name: Commitar o estado
        if: always() && inputs.ensaio != true
        run: |
          # Sem este commit o runner descartavel perde a memoria do que ja subiu
          # e a proxima execucao republica o mesmo video. Roda mesmo em falha:
          # a tentativa falhada tambem e estado (MAX_TENTATIVAS).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add distribuidos_pinterest.json
          git diff --staged --quiet || git commit -m "Distribui no Pinterest (auto)"
          git pull --rebase --autostash || true
          git push

      - name: Avisar se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const hoje = new Date().toISOString().slice(0, 10)
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Distribuicao no Pinterest falhou em " + hoje,
              body: "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId + "\n\n" +
                    "Causas comuns: Pinterest desconectado no Zernio (reconectar em " +
                    "zernio.com), chave ZERNIO_API_KEY revogada, token da Meta, " +
                    "ou o Pinterest recusou o video (duplicado / moderacao) — ver " +
                    "'erro' em distribuidos_pinterest.json."
            })
