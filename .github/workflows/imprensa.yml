name: Assessoria de imprensa

# ============================================================================
# Segunda-feira: o artigo mais novo vira release e vai para os veiculos do
# setor que publicam noticia.
#
# POR QUE: o vigia das IAs voltou 0 de 25 e o Google, 0 impressao. Falta
# AUTORIDADE CITAVEL — link e mencao de fora —, nao mais um lugar para postar.
#
# ⚠ A lista de e-mails NAO e chutada: `--descobrir` visita a pagina de contato
# dos veiculos e guarda so o que esta publicado la. Chutar endereco e spam, nao
# assessoria. O envio sai do Gmail do proprio Diego, com o nome dele, porque
# jornalista responde a pessoa e nao a caixa de marca — e por isso o volume
# precisa continuar baixo (uma dezena por semana).
# ============================================================================

on:
  schedule:
    - cron: "5 13 * * 1"   # segunda, 10h05 BRT
  workflow_dispatch:
    inputs:
      ensaio:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: imprensa
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install --quiet google-api-python-client google-auth

      - name: Procurar contatos novos
        run: python imprensa.py --descobrir

      - name: Enviar o release
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
        run: |
          args="--enviar"
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          python imprensa.py $args

      - name: Commitar o estado
        if: inputs.ensaio != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imprensa_contatos.json imprensa_enviados.json
          git diff --staged --quiet || git commit -m "Assessoria de imprensa (auto)"
          git pull --rebase --autostash || true
          git push

      - name: Avisar se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "Assessoria de imprensa falhou em " + new Date().toISOString().slice(0,10),
              body: "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId,
            })
