name: Post diario @vendanaobra

# ============================================================================
# AUTOMACAO DE POSTAGEM ENCERRADA EM 21/08/2026 (decisao do Diego).
#
# O @vendanaobra nao publica mais por API. Nada neste repo posta sozinho:
# os 3 workflows estao `disabled_manually` no GitHub E com o `schedule`
# comentado (trava dupla — reativar pela UI nao faz o cron voltar).
#
# Historico: este workflow ja estava com o cron comentado desde 17/08 (o
# carrossel de frase tinha saturado: 415 views em 19/07 contra 135 em 14/08).
# A pausa nao pegou de verdade — a `rede-de-seguranca.yml` continuou chamando
# `publicar.py --garantir` seg/qua/sex e publicou 17/08 e 19/08 assim mesmo.
# Agora as duas estao desligadas.
#
# O que o repo faz agora: PREPARA a peca (`preparar.py`) — gera os slides e a
# legenda e entrega no Desktop e no Drive. Quem posta e o Diego, do celular,
# pelo app do Instagram, como qualquer pessoa.
#
# Para voltar a postar por API algum dia: descomentar o `schedule` E rodar
# `gh workflow enable`. Nao fazer isso sem pedido explicito dele.
# ============================================================================

on:
  # DESLIGADO 21/08/2026: o bloco `schedule` inteiro esta comentado e o
  # workflow esta disabled no GitHub. `workflow_dispatch` so publica se quem
  # rodar tambem definir VNO_PUBLICAR_API=1 (trava dentro do publicar.py).
  #
  # schedule:
  #   # 14:45 UTC; o job espera ate 15:00:00 UTC = 12:00:00 em Brasilia.
  #   # A folga existe porque o agendador do Actions costuma atrasar alguns minutos.
  #   # 1,3,5 = seg/qua/sex; terca e quinta sao da mini-aula (miniaula.yml).
  #   - cron: "45 14 * * 1,3,5"
  workflow_dispatch:
    inputs:
      id:
        description: "Forcar uma frase especifica (id do frases.json)"
        required: false
        type: string
      ensaio:
        description: "Ensaio: testa o caminho todo sem publicar"
        required: false
        type: boolean
        default: false
      refazer:
        description: "Refazer: republica o post de hoje da frase --id com a arte nova"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Esperar o meio-dia em ponto
        if: github.event_name == 'schedule'
        run: |
          alvo=$(date -u -d "$(date -u +%F) 15:00:00" +%s)
          agora=$(date -u +%s)
          espera=$(( alvo - agora ))
          if [ "$espera" -gt 0 ]; then
            echo "esperando ${espera}s ate 15:00:00 UTC (12:00 BRT)"
            sleep "$espera"
          else
            echo "runner comecou atrasado (${espera}s); publicando agora"
          fi

      - name: Publicar carrossel
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          args=""
          [ -n "${{ inputs.id }}" ] && args="$args --id ${{ inputs.id }}"
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          [ "${{ inputs.refazer }}" = "true" ] && args="$args --refazer"
          python publicar.py $args

      - name: Abrir issue se o banco de frases acabar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Post diario falhou em " + new Date().toISOString().slice(0, 10),
              body: "O workflow de post diario falhou. Ver o run: " +
                    context.serverUrl + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId +
                    "\n\nCausas comuns: banco de frases esgotado ou token da Meta expirado."
            })
