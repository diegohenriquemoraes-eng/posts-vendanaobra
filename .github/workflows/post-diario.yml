name: Post diario @vendanaobra

# ============================================================================
# PAUSADO de 17/08 a 23/08/2026 (plano de reativacao de engajamento, 14/08).
#
# Motivo: o carrossel de frase saturou. Views por post, mesmo formato:
#   19/07 = 415 | 20/07 = 539 (pico) | 23/07 = 479 | 27/07 = 413
#   03/08 = 299 | 12/08 = 183 | 14/08 = 135
# Queda de 75% em 3 semanas. O publico aprendeu a rolar por cima.
#
# A mini-aula (miniaula.yml, ter/qui) CONTINUA rodando — carrossel e o formato
# mais eficiente da conta (indice 2,10 de interacao por view, contra 0,85 do
# Reel); o que saturou foi a FRASE, nao o carrossel.
#
# Nesta semana seg/qua/sex ficam para os Reels que o Diego grava.
#
# PARA RETOMAR em 24/08/2026: descomentar a linha do cron abaixo.
# Nao voltar com o formato identico — rever diagramacao e estrutura de legenda
# antes, e voltar 1x/semana em vez de 3x.
# ============================================================================
on:
  # PAUSADO: o bloco `schedule` inteiro esta comentado. O workflow continua
  # existindo e pode ser rodado a mao por workflow_dispatch (inclusive --ensaio).
  #
  # PARA RETOMAR em 24/08/2026: descomentar as 2 linhas abaixo.
  #
  # schedule:
  #   # 14:45 UTC; o job espera ate 15:00:00 UTC = 12:00:00 em Brasilia.
  #   # A folga existe porque o agendador do Actions costuma atrasar alguns minutos.
  #   # 1,3,5 = seg/qua/sex; terca e quinta sao da mini-aula (miniaula.yml).
  #   - cron: "45 14 * * 1,3,5"
  workflow_dispatch:
    inputs:
      id:
        description: "Forcar uma frase especifica (id do frases.json)"
        required: false
        type: string
      ensaio:
        description: "Ensaio: testa o caminho todo sem publicar"
        required: false
        type: boolean
        default: false
      refazer:
        description: "Refazer: republica o post de hoje da frase --id com a arte nova"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Esperar o meio-dia em ponto
        if: github.event_name == 'schedule'
        run: |
          alvo=$(date -u -d "$(date -u +%F) 15:00:00" +%s)
          agora=$(date -u +%s)
          espera=$(( alvo - agora ))
          if [ "$espera" -gt 0 ]; then
            echo "esperando ${espera}s ate 15:00:00 UTC (12:00 BRT)"
            sleep "$espera"
          else
            echo "runner comecou atrasado (${espera}s); publicando agora"
          fi

      - name: Publicar carrossel
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          args=""
          [ -n "${{ inputs.id }}" ] && args="$args --id ${{ inputs.id }}"
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          [ "${{ inputs.refazer }}" = "true" ] && args="$args --refazer"
          python publicar.py $args

      - name: Abrir issue se o banco de frases acabar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Post diario falhou em " + new Date().toISOString().slice(0, 10),
              body: "O workflow de post diario falhou. Ver o run: " +
                    context.serverUrl + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId +
                    "\n\nCausas comuns: banco de frases esgotado ou token da Meta expirado."
            })
