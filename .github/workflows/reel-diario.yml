name: Reel diario @vendanaobra

# ============================================================================
# FILA DO ALUPARTS PODCAST #EP25 — 12 cortes, um por dia, 09h BRT.
#
# Criado em 24/08/2026. Os 12 cortes da participacao do Diego no EP25 saem em
# ordem (reels_ep25.json), como COLABORACAO com o perfil da Aluparts.
#
# Por que 09h e nao 12h: a mini-aula ocupa terca e quinta as 12h (miniaula.yml).
# 09h e o segundo melhor horario medido da conta (mediana 427 views contra 545
# das 12h no periodo organico de jul/ago) e deixa 3h de folga do carrossel.
#
# LIGADO em 24/08/2026, com os cortes e as capas aprovados pelo Diego. O corte
# 01 saiu na mao no mesmo dia; o cron pega o proximo da fila a partir de 25/08.
# Colaborador fixo: @aluparts.oficial (reels_ep25.json).
# ============================================================================

on:
  schedule:
    # 04/09/2026: saiu das 09h BRT. Com o metodo ROTA 100K o @vendanaobra passou
    # a publicar 4 Reels proprios por dia — 09:00, 12:30, 16:00 e 19:00 — e o
    # corte do EP25 batia de frente com o primeiro deles, que e' o que carrega o
    # gancho do dia. 14h15 e' o meio do maior buraco da grade (12:30 -> 16:00) e
    # e' horario de fora-de-pico, que combina com corte de podcast.
    - cron: "2 17 * * *"    # dispara 17:02 UTC, publica ~14h15 BRT
    - cron: "7 19 * * *"    # repescagem 16h05 BRT, so se o do dia nao saiu
    - cron: "23 20 * * *"   # 2a repescagem 17h23 BRT (27/08/2026: o GitHub perdeu
                            # os dois crons do dia e o Reel nao saiu; minuto 0 e o
                            # horario de maior fila, por isso os minutos quebrados)
  workflow_dispatch:
    inputs:
      id:
        description: "Forcar um corte especifico (01 a 12)"
        required: false
        type: string
      ensaio:
        description: "Ensaio: mostra o que sairia, sem publicar"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esperar as 9h em ponto
        if: github.event_name == 'schedule' && github.event.schedule == '45 11 * * *'
        run: |
          alvo=$(date -u -d "$(date -u +%F) 12:00:00" +%s)
          agora=$(date -u +%s)
          espera=$(( alvo - agora ))
          if [ "$espera" -gt 0 ]; then
            echo "esperando ${espera}s ate 12:00:00 UTC (09h BRT)"
            sleep "$espera"
          else
            echo "runner comecou atrasado (${espera}s); publicando agora"
          fi

      - name: Publicar Reel
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          VNO_REEL_ATIVO: "1"   # aprovado pelo Diego em 24/08/2026
        run: |
          args=""
          [ -n "${{ inputs.id }}" ] && args="$args --id ${{ inputs.id }}"
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          # TODO disparo agendado usa --garantir: cron do GitHub chega atrasado
          # (ate 9h de atraso medido em 27/08/2026) e um atrasado sem essa trava
          # publica um segundo Reel no mesmo dia.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            args="$args --garantir"
          fi
          python publicar_reel.py $args

      - name: Avisar se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const hoje = new Date().toISOString().slice(0, 10)
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Reel diario falhou em " + hoje,
              body: "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId + "\n\n" +
                    "Causas comuns: token da Meta, video grande demais para a API " +
                    "processar no tempo, ou fila do EP25 terminada."
            })
