name: Reel diario @vendanaobra

# ============================================================================
# FILA DO ALUPARTS PODCAST #EP25 — 12 cortes, um por dia, 09h BRT.
#
# Criado em 24/08/2026. Os 12 cortes da participacao do Diego no EP25 saem em
# ordem (reels_ep25.json), como COLABORACAO com o perfil da Aluparts.
#
# Por que 09h e nao 12h: a mini-aula ocupa terca e quinta as 12h (miniaula.yml).
# 09h e o segundo melhor horario medido da conta (mediana 427 views contra 545
# das 12h no periodo organico de jul/ago) e deixa 3h de folga do carrossel.
#
# ⚠️ DESLIGADO ATE O DIEGO APROVAR. Duas travas, de proposito:
#   1. o cron abaixo esta comentado;
#   2. publicar_reel.py exige VNO_REEL_ATIVO=1.
# Para ligar: descomentar o schedule E trocar o env abaixo para "1".
# Antes de ligar, preencher "colaboradores" no reels_ep25.json — sem isso o
# post sai sem a colaboracao e collab nao se adiciona depois de publicado.
# ============================================================================

on:
  # schedule:
  #   - cron: "45 11 * * *"   # dispara 11:45 UTC, publica 12:00 UTC = 09h BRT
  #   - cron: "0 14 * * *"    # repescagem 11h BRT, so se o do dia nao saiu
  workflow_dispatch:
    inputs:
      id:
        description: "Forcar um corte especifico (01 a 12)"
        required: false
        type: string
      ensaio:
        description: "Ensaio: mostra o que sairia, sem publicar"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esperar as 9h em ponto
        if: github.event_name == 'schedule' && github.event.schedule == '45 11 * * *'
        run: |
          alvo=$(date -u -d "$(date -u +%F) 12:00:00" +%s)
          agora=$(date -u +%s)
          espera=$(( alvo - agora ))
          if [ "$espera" -gt 0 ]; then
            echo "esperando ${espera}s ate 12:00:00 UTC (09h BRT)"
            sleep "$espera"
          else
            echo "runner comecou atrasado (${espera}s); publicando agora"
          fi

      - name: Publicar Reel
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          VNO_REEL_ATIVO: "0"   # trocar para "1" quando o Diego aprovar
        run: |
          args=""
          [ -n "${{ inputs.id }}" ] && args="$args --id ${{ inputs.id }}"
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "45 11 * * *" ]; then
            args="$args --garantir"
          fi
          python publicar_reel.py $args

      - name: Avisar se falhou
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const hoje = new Date().toISOString().slice(0, 10)
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Reel diario falhou em " + hoje,
              body: "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId + "\n\n" +
                    "Causas comuns: token da Meta, video grande demais para a API " +
                    "processar no tempo, ou fila do EP25 terminada."
            })
